<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>文档台 DocDesk · 在线工作台</title>
<link rel="icon" href="https://raw.githubusercontent.com/RHH-herry/docdesk/main/static/brand/favicon.svg" type="image/svg+xml">
<style>
  :root { --brand:#0E7C6B; --dark:#0A574B; --soft:#E3F1ED; --ink:#15261F; }
  * { box-sizing:border-box; }
  html,body { margin:0; min-height:100%; }
  body {
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    color:var(--ink); background:#FBFBF8; display:flex; align-items:center; justify-content:center;
    padding:24px;
  }
  .card {
    width:min(560px,100%); background:#fff; border:1px solid #E4E8E5; border-radius:14px;
    padding:44px 40px; text-align:center;
  }
  .mark { width:64px; height:64px; margin:0 auto 20px; display:block; }
  .kicker { font-size:11px; letter-spacing:.18em; color:var(--brand); font-weight:700; text-transform:uppercase; }
  h1 { font-size:26px; margin:12px 0 8px; letter-spacing:-.01em; }
  p { color:#5C6B64; font-size:15px; line-height:1.7; margin:0 0 26px; }
  .btn {
    display:inline-block; background:var(--brand); color:#fff; text-decoration:none;
    font-size:15px; font-weight:600; padding:13px 30px; border-radius:8px;
  }
  .btn:hover { background:var(--dark); }
  .note { margin-top:22px; font-size:12px; color:#8A968F; }
  .bar { height:3px; background:var(--soft); border-radius:2px; overflow:hidden; margin:0 auto 26px; max-width:220px; }
  .bar i { display:block; height:100%; background:var(--brand); width:0; animation:fill 3.2s linear forwards; }
  @keyframes fill { to { width:100%; } }
</style>
</head>
<body>
  <main class="card">
    <img class="mark" src="https://raw.githubusercontent.com/RHH-herry/docdesk/main/static/brand/logo-mark.svg" alt="文档台标志" onerror="this.style.display='none'">
    <div class="kicker">DocDesk · 在线工作台</div>
    <h1>文档台</h1>
    <p>把一叠单据，变成可对账的业务底稿。<br>正在为你打开在线工作台……</p>
    <div class="bar"><i></i></div>
    <a class="btn" id="go" href="https://wbapp-unrp1e4dhhyyx844v58dzw.app.workbuddy.host/?sharecode=5MSJEPIRMD">立即进入工作台</a>
    <div class="note">若未自动跳转，请点击上方按钮。数据仅存于你的浏览器。</div>
  </main>
<script>
  // 门面页：3.2 秒后自动跳到 WorkBuddy 代管的工作台
  (function () {
    var url = document.getElementById("go").href;
    setTimeout(function () { window.location.replace(url); }, 3200);
  })();
</script>
</body>
</html>
